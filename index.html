<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo Numérico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/page.js" defer></script>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand mb-0 h1"><i class="bi bi-calculator"></i> CalcTave</span>
    </div>
</nav>

<div class="container mb-5">
    <div class="row">
        <div class="col-md-4 col-lg-3 mb-4">
            <div class="card p-3">
                <h5 class="card-title border-bottom pb-2">Métodos</h5>
                <div class="nav flex-column nav-pills" id="v-pills-tab">
                    <h6 class="mt-3 text-muted small fw-bold">RAÍZES</h6>
                    <button class="nav-link text-start active" onclick="renderForm('bissecao')">Bisseção</button>
                    <button class="nav-link text-start" onclick="renderForm('ponto-fixo')">Ponto Fixo</button>
                    <button class="nav-link text-start" onclick="renderForm('newton')">Newton-Raphson</button>
                    <button class="nav-link text-start" onclick="renderForm('secante')">Secante</button>

                    <h6 class="mt-3 text-muted small fw-bold">SISTEMAS</h6>
                    <button class="nav-link text-start" onclick="renderForm('gauss')">Eliminação de Gauss (Com Pivoteamento)</button>
                    <button class="nav-link text-start" onclick="renderForm('lu')">Fatoração LU</button>
                    <button class="nav-link text-start" onclick="renderForm('jacobi')">Iterativos Jacobi</button>
                    <button class="nav-link text-start" onclick="renderForm('gauss-seidel')">Iterativo Gauss-Seidel</button>

                    <h6 class="mt-3 text-muted small fw-bold">AJUSTE DE CURVA</h6>
                    <button class="nav-link text-start" onclick="renderForm('regressao')">Regressão Linear</button>
                    <button class="nav-link text-start" onclick="renderForm('mmq')">Método dos Mínimos Quadrados (MMQ)</button>
                </div>
            </div>
        </div>

        <div class="col-md-8 col-lg-9">
            <div class="card p-4">
                <div id="dynamic-form-container">
                    </div>
                
                <div id="result-area" class="mt-5 p-3 bg-light border rounded d-none">
                    <h5>Resultado:</h5>
                    <div id="result-content" class="font-monospace"></div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
